# ─────────────────────────────────────────────────────────────
# stop-hook-iter：stop hook + reviewer decide_stop + 多 iters
# ─────────────────────────────────────────────────────────────
# 默认 runtime=claude_sdk（stop hook → reviewer decide_stop 工作，能跑出
# reviewer 判 let_exit/block + 多 iters）。cli 的验证情况见 README。
# ─────────────────────────────────────────────────────────────

project_dir: .

runtime: claude_sdk

starting_prompt: |
  补全计算器 CLI 工程。sample-project/calc.py 已写好（算术表达式计算器核心，ast parse+eval）。
  按顺序补全三阶段（产物都写到 sample-project/ 下）：
  - 阶段1：写 sample-project/cli.py（命令行入口，`python cli.py "1+2*3"` 输出 7）
  - 阶段2：写 sample-project/test_calc.py（测试 calc.evaluate，需能过）
  - 阶段3：写 sample-project/README.md（用法+示例）
  三阶段全做完算完成。做完一个阶段继续下一个，直到三个都完成。

reviewer:
  enabled: true
  model: ""   # 留空 → 读 env ANTHROPIC_MODEL（GLM/第三方）
  task_goal: |
    计算器 CLI 工程补全三阶段：cli.py（命令行入口）→ test_calc.py（测试需过）→ README.md（文档）。
    三个文件都写完、test_calc.py 能通过，才算完成；缺任何一个都不算完成，要求 worker 继续。

loop:
  evaluator: passthrough   # 跑满 max_iterations，每轮靠 stop hook 的 reviewer decide_stop 判
  max_iterations: 3

hook_server:
  enabled: true
  host: localhost
