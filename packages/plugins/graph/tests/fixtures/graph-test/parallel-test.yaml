workflow: parallel-test
description: 测试 agent 暂停（agent 节点串行执行，非并行）
max_parallel: 2
work_dir: .
agents_dir: ./agents
nodes:
  - id: prep
    task_type: bash
    command: rm -rf ./output && mkdir -p ./output && echo "ok" > ./output/prep.txt
    acceptance:
      enabled: true
      type: script
      script: test -f output/prep.txt
    depends_on: []

  - id: agent-1
    task_type: agent
    executor: simple-worker
    task_description: "创建 output/agent-1.txt 并写入 agent-1-done。"
    acceptance:
      enabled: true
      type: script
      script: test -f output/agent-1.txt
    depends_on: [prep]

  - id: agent-2
    task_type: agent
    executor: simple-worker
    task_description: "创建 output/agent-2.txt 并写入 agent-2-done。"
    acceptance:
      enabled: true
      type: script
      script: test -f output/agent-2.txt
    depends_on: [prep]
