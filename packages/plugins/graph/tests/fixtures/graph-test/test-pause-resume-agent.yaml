workflow: test-pause-resume-agent
description: 快速测试 pause/resume（agent 验收，并行 node）
max_parallel: 2
work_dir: .
agents_dir: ./agents
nodes:
  - id: A
    task_type: bash
    command: echo "A-done" > output_a.txt
    acceptance:
      enabled: true
      type: agent
      verifier: simple-verifier
    depends_on: []

  - id: B
    task_type: bash
    command: echo "B-done" > output_b.txt
    acceptance:
      enabled: true
      type: agent
      verifier: simple-verifier
    depends_on: []

  - id: C
    task_type: bash
    command: echo "C-done" > output_c.txt
    acceptance:
      enabled: true
      type: agent
      verifier: simple-verifier
    depends_on: ["A", "B"]
