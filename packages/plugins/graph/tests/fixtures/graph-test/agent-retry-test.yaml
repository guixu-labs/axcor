workflow: agent-retry-test
description: 验证 agent 重试路径的 prompt 注入（第 N 次尝试 + 上轮验收反馈 + 上轮报告路径）
max_parallel: 1
work_dir: .
agents_dir: ./agents
nodes:
  - id: init
    task_type: bash
    command: rm -rf output reports && mkdir -p output reports && echo "init-ok" > output/init.txt
    acceptance:
      enabled: true
      type: script
      script: test -f output/init.txt
    depends_on: []

  - id: flaky-agent
    task_type: agent
    executor: simple-worker
    task_description: "按规则创建 output/agent.txt。"
    task_goal: |
      创建 output/agent.txt，写入规则：
      - 如果任务中没有「重试上下文」段落（即这是第 1 次尝试），文件内容写 first-attempt
      - 如果任务中有「重试上下文」段落且说明这是第 2 次尝试，文件内容写 retry-passed
      完成后返回 DONE。
    acceptance:
      enabled: true
      type: script
      script: grep -q retry-passed output/agent.txt
      max_retries: 1
      on_exhaust: stop
    report:
      enabled: true
      save_to: "reports/flaky-agent-attempt-{{attempt}}.md"
    depends_on: [init]
