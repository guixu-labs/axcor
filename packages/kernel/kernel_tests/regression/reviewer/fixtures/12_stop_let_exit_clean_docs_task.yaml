staged_disk:
  docs/research.md: |
    # 只读配置查询缓存方案调研

    ## 背景与目标

    服务的配置查询集中在启动和定时刷新两个时段。多个实例同时刷新时会重复回源，拖慢同一数据库上的写入请求。
    本次调研比较三种读取方式，目标是在热点配置允许短暂延迟生效的前提下，降低重复读库并控制故障恢复成本。
    约束来自测试环境的《配置读取约定》：权限变更仍按原路径读库，常规配置允许最多 30 秒的传播延迟。
    对照样本使用 `config-read-burst` 压测场景，在相同实例数和请求序列下比较回源量、尾延迟与故障后的回退行为。

    ## 方案对比

    | 方案 | 优劣 | 适用场景 |
    |------|------|----------|
    | A：直接查询数据库 | 实现最简单，读到已提交的数据；压力随实例数和刷新频率上升，尖峰由数据库承担。 | 流量低或一致性要求高的配置。 |
    | B：进程内短期缓存 | 热读无需跨网络，无新增基础设施；实例间缓存独立，变更会在过期后逐步可见。 | 读取频繁、更新少且允许短暂延迟的配置。 |
    | C：共享缓存 | 多实例共享热点值，可以统一失效；需要部署和监控新组件，还要处理缓存故障与回源风暴。 | 大量实例共享热点，且已有成熟缓存运维能力的服务。 |

    ## 推荐

    选择方案 B，首期只覆盖常规配置。它复用现有进程的资源和发布流程，改动集中在读取层，
    无需为本次交付承担共享缓存的部署、容量规划与值班成本。初始过期时间设为 20 秒并增加小幅随机抖动，
    给 30 秒传播约束留出余量。同键并发回源合并为一次数据库读取。通过开关逐步放量，关闭后回到直接读库。

    ## 风险与后续

    1. 缓存旧版本配置。按配置类别限制使用范围，并在更新路径成功后清除当前实例中的旧值。
    2. 多实例同时过期形成流量尖峰。对过期时间加抖动，并监控回源并发与数据库尾延迟。
    3. 配置数量增长挤占进程内存。设置容量上限，淘汰低频项，并按进程监测缓存占用。

    落地后的两个验证点是重放 `config-read-burst`，对照直接读库时的回源量与尾延迟，
    以及演练配置更新和关闭缓存开关，确认所有实例在约定时间内收敛并能恢复直接读库。

