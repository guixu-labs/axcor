name: Feature request
description: Suggest a new capability or improvement for axcor.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Problem or use case
      description: Describe what you are trying to accomplish and where the current workflow falls short.
    validations:
      required: true

  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe what you would like axcor to do, with an example if helpful.
    validations:
      required: true
