name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:

jobs:
  forbidden-word-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 用词检查
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after }}
        run: |
          : "${BASE_SHA:?Missing base SHA}" "${HEAD_SHA:?Missing head SHA}"
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$BASE_SHA" == "$zero_sha" || "$HEAD_SHA" == "$zero_sha" ]]; then
            echo "::error::base/head SHA 为全零（如新建分支推送），无法确定词检范围。请在已有 base/head 的提交上运行，或改用 pull_request / merge_group 事件。"
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin "$BASE_SHA" 2>"$RUNNER_TEMP/fetch-base.log"; then
              cat "$RUNNER_TEMP/fetch-base.log" >&2
              echo "::error::无法获取 base 提交 $BASE_SHA （可能已被 force push 淘汰而不可达），无法执行词检。请确认该提交仍可达后重试。"
              exit 1
            fi
          fi
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin "$HEAD_SHA" 2>"$RUNNER_TEMP/fetch-head.log"; then
              cat "$RUNNER_TEMP/fetch-head.log" >&2
              echo "::error::无法获取 head 提交 $HEAD_SHA （可能已被 force push 淘汰而不可达），无法执行词检。请确认该提交仍可达后重试。"
              exit 1
            fi
          fi
          python scripts/check_ai_words.py --pr "$BASE_SHA" "$HEAD_SHA"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装锁定依赖
        run: uv sync --locked

      - name: 代码风格与静态检查
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run lint-imports --no-cache
          uv run codespell $(git ls-files '*.md')

      - name: 测试与架构门禁
        run: uv run pytest -q

      - name: 各发行包独立构建
        run: |
          uv build --package workflow-controller-kernel
          uv build --package workflow-controller-plugin-agent-traceback
          uv build --package workflow-controller-plugin-breather
          uv build --package workflow-controller-plugin-fake-driver
          uv build --package workflow-controller-plugin-file-provenance
          uv build --package workflow-controller-plugin-graph
          uv build --package workflow-controller-plugin-staged-pipeline
          uv build --package workflow-controller-hookserver

  kernel-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 构建内核与验收驱动 wheel
        run: |
          uv build --package workflow-controller-kernel --wheel --out-dir dist
          uv build --package workflow-controller-plugin-fake-driver --wheel --out-dir dist

      - name: 干净环境安装 wheel
        run: |
          uv venv "$RUNNER_TEMP/kernel-only"
          uv pip install --python "$RUNNER_TEMP/kernel-only/bin/python" dist/*.whl

      - name: headless fake run 冒烟
        run: $RUNNER_TEMP/kernel-only/bin/python scripts/fake_run_smoke.py

  subset:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [agent-traceback, breather, file-provenance, graph, staged-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 导出 kernel+单插件子集
        run: python3 scripts/export_subset.py --output "$RUNNER_TEMP/subset" --plugin "${{ matrix.plugin }}"

      - name: 子集自治测试
        working-directory: ${{ runner.temp }}/subset
        run: |
          uv sync
          uv run pytest -q

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/opencode-file-provenance
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装锁定依赖
        run: npm ci

      - name: 安装 Python 侧插件包
        run: uv sync --locked

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test
