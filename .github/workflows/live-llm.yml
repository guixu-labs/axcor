name: live-llm

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-llm:
    # Report a skipped check on PRs so they can enter the merge queue.
    if: >-
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Fixture 13 和 14 各调用 5 次。回放用裸 DriverReviewerRunner()、不配 auth rotator，
    # 429/超时直接抛错不重试，单模型最坏约 10×300s=50min（见 BASELINE.md「CI 并行配置」）。
    # 多模型并行共用限流预算，保留 240min。
    timeout-minutes: 240
    # Configure required reviewers before adding the model token to this environment.
    environment: live-llm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装锁定依赖
        run: uv sync --locked

      - name: 运行实模测试
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LIVE_LLM_PROTECTED_ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.LIVE_LLM_ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODELS: ${{ vars.LIVE_LLM_ANTHROPIC_MODELS }}
        run: |
          : "${ANTHROPIC_AUTH_TOKEN:?Configure LIVE_LLM_PROTECTED_ANTHROPIC_AUTH_TOKEN in the live-llm environment}"
          : "${ANTHROPIC_BASE_URL:?Configure the LIVE_LLM_ANTHROPIC_BASE_URL variable}"
          # 先剥离 CRLF 的 \r，否则经 gh / REST 写入的 CRLF 会把 \r 留在除末尾外的每个 ID 里。
          model_list="${ANTHROPIC_MODELS//$'\r'/}"
          model_list="${model_list//$'\n'/ }"
          read -r -a models <<< "${model_list//,/ }"
          if (( ${#models[@]} == 0 )); then
            echo "Configure the LIVE_LLM_ANTHROPIC_MODELS variable" >&2
            exit 1
          fi

          logs_dir=$(mktemp -d)
          dump_partial_logs() {
            local index
            for index in "${!models[@]}"; do
              [ -f "$logs_dir/$index.log" ] || continue
              printf '::group::%s (partial)\n' "${models[$index]}"
              cat "$logs_dir/$index.log"
              printf '%s\n' '::endgroup::'
            done
          }
          # 作业超时 / 取消时先收到 SIGINT / SIGTERM：先抢救各模型已产生的日志再清理，
          # 否则缓冲在文件里的输出会随临时目录一起消失，长作业中断后无任何线索。
          trap 'dump_partial_logs; exit 130' INT
          trap 'dump_partial_logs; exit 143' TERM
          trap 'rm -rf -- "$logs_dir"' EXIT
          pids=()
          # 固定 reviewer replay 的两个 pytest 节点：合并队列执行 base+PR 合并代码，
          # 不能按 marker 全仓选择测试，否则 fork PR 可在别处新增打标测试窃取实模凭证。
          for index in "${!models[@]}"; do
            ANTHROPIC_MODEL="${models[$index]}" \
              uv run --locked pytest -q --live \
                'packages/kernel/kernel_tests/regression/reviewer/test_reviewer_replay.py::test_reviewer_replay[13_stop_external_blocker_required_item]' \
                'packages/kernel/kernel_tests/regression/reviewer/test_reviewer_replay.py::test_reviewer_replay[14_stop_issue_111_path_checks_only]' \
              > "$logs_dir/$index.log" 2>&1 &
            pids+=("$!")
          done

          status=0
          for index in "${!models[@]}"; do
            result=0
            wait "${pids[$index]}" || result=$?
            printf '::group::%s (exit %s)\n' "${models[$index]}" "$result"
            cat "$logs_dir/$index.log"
            printf '%s\n' '::endgroup::'
            if (( result != 0 )); then
              status=1
            fi
          done
          exit "$status"
