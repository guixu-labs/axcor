name: live-llm

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-llm:
    # Report a skipped check on PRs so they can enter the merge queue.
    if: >-
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # 12 个 fixture，单次调用超时 300s，限流时再重试 1 次，最坏约 12×600s=120min。
    timeout-minutes: 120
    # Configure required reviewers before adding the model token to this environment.
    environment: live-llm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装锁定依赖
        run: uv sync --locked

      - name: 运行实模测试
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LIVE_LLM_PROTECTED_ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.LIVE_LLM_ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODELS: ${{ vars.ANTHROPIC_MODELS }}
        run: |
          : "${ANTHROPIC_AUTH_TOKEN:?Configure LIVE_LLM_PROTECTED_ANTHROPIC_AUTH_TOKEN in the live-llm environment}"
          : "${ANTHROPIC_BASE_URL:?Configure the LIVE_LLM_ANTHROPIC_BASE_URL variable}"
          model_list="${ANTHROPIC_MODELS//$'\n'/ }"
          read -r -a models <<< "${model_list//,/ }"
          if (( ${#models[@]} == 0 )); then
            echo "Configure the ANTHROPIC_MODELS variable" >&2
            exit 1
          fi

          logs_dir=$(mktemp -d)
          trap 'rm -rf -- "$logs_dir"' EXIT
          pids=()
          # 只跑固定的 reviewer replay 目录：合并队列执行 base+PR 合并代码，
          # 不能按 marker 全仓选择测试，否则 fork PR 可在别处新增打标测试窃取实模凭证。
          for index in "${!models[@]}"; do
            ANTHROPIC_MODEL="${models[$index]}" \
              uv run --locked pytest -q --live packages/kernel/kernel_tests/regression/reviewer/ \
              > "$logs_dir/$index.log" 2>&1 &
            pids+=("$!")
          done

          status=0
          for index in "${!models[@]}"; do
            result=0
            wait "${pids[$index]}" || result=$?
            printf '::group::%s (exit %s)\n' "${models[$index]}" "$result"
            cat "$logs_dir/$index.log"
            printf '%s\n' '::endgroup::'
            if (( result != 0 )); then
              status=1
            fi
          done
          exit "$status"
