[project]
name = "axcor"
version = "0.1.0"
description = "Workflow Controller 内核与内置插件的 uv workspace 仓"
requires-python = ">=3.12"
dependencies = [
    "workflow-controller-kernel",
]

[dependency-groups]
dev = [
    "workflow-controller-plugin-breather",
    "workflow-controller-plugin-fake-driver",
    "workflow-controller-plugin-file-provenance",
    "workflow-controller-plugin-graph",
    "workflow-controller-plugin-staged-pipeline",
    "import-linter>=2.13,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8,<0.16",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "claude-agent-sdk>=0.1",
    "codespell>=2.4,<2.5",
]

[tool.uv]
package = false

[tool.uv.sources]
workflow-controller-kernel = { workspace = true }
workflow-controller-plugin-breather = { workspace = true }
workflow-controller-plugin-fake-driver = { workspace = true }
workflow-controller-plugin-file-provenance = { workspace = true }
workflow-controller-plugin-graph = { workspace = true }
workflow-controller-plugin-staged-pipeline = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/kernel",
    "packages/hookserver",
    "packages/plugins/breather",
    "packages/plugins/fake-driver",
    "packages/plugins/file-provenance",
    "packages/plugins/graph",
    "packages/plugins/staged-pipeline",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
# N815：与外部 JSON 字段对齐的 camelCase 命名；E402：部分运行时延迟导入
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N815", "E402"]

[tool.ruff.lint.per-file-ignores]
# tests/examples 白盒断言与演示桩使用字符串成员名形式访问受保护成员
# （getattr/setattr/monkeypatch；main code 禁用该形态），常量属性名的
# B009/B010 告警在此场景豁免
"tests/**" = ["B009", "B010"]
"packages/*/kernel_tests/**" = ["B009", "B010"]
"packages/plugins/*/tests/**" = ["B009", "B010"]
"examples/**" = ["B009", "B010"]

[tool.ruff.lint.isort]
known-first-party = ["workflow_controller"]
# tests 归入 local-folder 分区（顺序在 first-party 之后），与检查器结论一致
known-local-folder = ["tests", "kernel_tests"]

[tool.codespell]
# CANN 生态专名与 Naive UI 组件名等合法词汇；deriver 为既有设计术语
ignore-words-list = "CANN,cann,NEmpty,deriver,NAM"

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
# 插件包测试目录同名 tests/：按命名空间包推导模块名，避免与仓根 tests 包互撞
consider_namespace_packages = true
norecursedirs = ["node_modules", "dist", "build", "*.egg-info"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests",
    "e2e: end-to-end tests (deselect with '-m \"not e2e\"')",
    "live_llm: tests that spawn a real claude subprocess; skipped unless --live is passed",
    "reviewer_recall: marks tests that call real claude.CMD reviewer (api cost)",
]

[tool.importlinter]
root_package = "workflow_controller"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "plugin-sdk-independence"
name = "Plugin SDK must not import host or concrete plugin code"
type = "forbidden"
source_modules = ["workflow_controller.plugin"]
forbidden_modules = [
    "workflow_controller.api",
    "workflow_controller.core",
    "workflow_controller.plugins",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "builtin-plugin-independence"
name = "Built-in plugins must not import sibling plugins"
type = "forbidden"
source_modules = ["workflow_controller.plugins.*"]
forbidden_modules = ["workflow_controller.plugins.*"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "runtime-independence"
name = "Runtime packages must not import control plane or plugin code"
type = "forbidden"
source_modules = [
    "workflow_controller.driver",
    "workflow_controller.event",
    "workflow_controller.hooks",
    "workflow_controller.store",
    "workflow_controller.watchdog",
]
forbidden_modules = [
    "workflow_controller.api",
    "workflow_controller.plugins",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "transcript-neutrality"
name = "Transcript layer must not import any workflow_controller package"
type = "forbidden"
source_modules = ["workflow_controller.transcript"]
forbidden_modules = [
    "workflow_controller.__main__",
    "workflow_controller.api",
    "workflow_controller.config",
    "workflow_controller.core",
    "workflow_controller.driver",
    "workflow_controller.event",
    "workflow_controller.headless",
    "workflow_controller.hooks",
    "workflow_controller.logging_config",
    "workflow_controller.plugin",
    "workflow_controller.plugins",
    "workflow_controller.session",
    "workflow_controller.store",
    "workflow_controller.support",
    "workflow_controller.watchdog",
]
allow_indirect_imports = true

[tool.coverage.run]
source = ["workflow_controller"]
omit = ["tests/*"]
